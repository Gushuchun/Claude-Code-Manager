name: Feature request
description: Suggest a new feature for ccm
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to share your idea!
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: A clear description of the problem you are trying to solve.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you like to see added?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Any alternative solutions you considered.
